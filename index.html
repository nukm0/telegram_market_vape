<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Market - ТГ Маркет</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Шапка -->
    <header class="admin-header">
        <div class="admin-logo">
            <div class="logo-icon">
                <i class="fas fa-smoking"></i>
            </div>
            <h1>Vape Market</h1>
        </div>
        <div class="admin-user">
            <div class="user-avatar">
                <i class="fas fa-crown"></i>
            </div>
            <span class="username">Админ</span>
        </div>
        <!-- Кнопка админ панели -->
        <button class="admin-panel-btn" id="adminPanelBtn" title="Админ панель" style="display: none;">
            <i class="fas fa-shield-alt"></i>
        </button>
    </header>

    <!-- Контент -->
    <main class="main-content">
        <!-- Поиск -->
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск товаров..." class="search-input">
            </div>
        </div>

        <!-- Фильтры -->
        <div class="filters-container">
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">
                    Все
                </button>
                <button class="filter-btn" data-filter="sell">
                    Продажа
                </button>
                <button class="filter-btn" data-filter="buy">
                    Покупка
                </button>
            </div>
        </div>

        <!-- Рекламный баннер -->
        <div id="adBanner" class="ad-banner admin-only" style="display: none;">
            <h3><i class="fas fa-ad"></i> Рекламное место</h3>
            <p>Текст рекламы здесь. Только для администраторов.</p>
            <button class="action-btn" onclick="editAdBanner()" style="margin-top: 10px;">
                <i class="fas fa-edit"></i> Изменить рекламу
            </button>
        </div>

        <!-- Кнопка создания -->
        <div class="create-ad-section">
            <button class="create-ad-btn" id="createAdBtn">
                <i class="fas fa-plus-circle"></i>
                Разместить объявление
            </button>
        </div>

        <!-- Объявления -->
        <div class="ads-section">
            <h2 class="section-title">Объявления</h2>
            <div id="adsGrid" class="ads-grid">
                <!-- Загружаются динамически -->
                <div class="loading-ads">
                    <div class="spinner"></div>
                    <p>Загрузка объявлений...</p>
                </div>
            </div>
        </div>

        <!-- Статистика -->
        <div class="ads-section">
            <h2 class="section-title">Статистика платформы</h2>
            <div class="profile-stats-grid">
                <div class="stat-card">
                    <span class="stat-number" id="totalUsers">0</span>
                    <span class="stat-label">Пользователей онлайн</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalAds">0</span>
                    <span class="stat-label">Активных объявлений</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="todayAds">0</span>
                    <span class="stat-label">Объявлений сегодня</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalDeals">0</span>
                    <span class="stat-label">Успешных сделок</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Навигация -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-page="ads">
            <i class="fas fa-list"></i>
            <span>Объявления</span>
        </button>
        <button class="nav-btn" data-page="profile" id="profileBtn">
            <i class="fas fa-user"></i>
            <span>Кабинет</span>
        </button>
        <button class="nav-btn" data-page="faq" id="faqBtn">
            <i class="fas fa-question-circle"></i>
            <span>FAQ</span>
        </button>
    </nav>

    <!-- Скрипты -->
    <script src="config.js"></script>
    <script src="app.js?v=3.0"></script>
</body>
</html>
