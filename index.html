<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Market - Telegram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Шапка (оставляем как было) -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Vape Market</h1>
                <nav class="nav-menu">
                    <a href="index.html" class="nav-item active">
                        <i class="fas fa-home"></i>
                        <span>Главная</span>
                    </a>
                    <a href="pages/profile.html" class="nav-item">
                        <i class="fas fa-user"></i>
                        <span>Профиль</span>
                    </a>
                    <a href="pages/faq.html" class="nav-item">
                        <i class="fas fa-question-circle"></i>
                        <span>FAQ</span>
                    </a>
                    <div id="adminPanelNav" style="display: none;">
                        <a href="pages/admin.html" class="nav-item">
                            <i class="fas fa-shield-alt"></i>
                            <span>Админ-панель</span>
                        </a>
                    </div>
                </nav>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Баннер (оставляем как было) -->
            <div class="banner">
                <h2>Добро пожаловать в Vape Market</h2>
                <p>Покупайте и продавайте вейп-товары безопасно и удобно</p>
            </div>

            <!-- Кнопки действий (оставляем расположение как было) -->
            <div class="action-buttons">
                <button class="btn btn-primary" id="createAdBtn">
                    <i class="fas fa-plus"></i>
                    <span>Создать объявление</span>
                </button>
                <button class="btn btn-secondary" id="myAdsBtn">
                    <i class="fas fa-list"></i>
                    <span>Мои объявления</span>
                </button>
                <button class="btn btn-secondary" id="favoritesBtn">
                    <i class="fas fa-heart"></i>
                    <span>Избранное</span>
                </button>
            </div>

            <!-- Рекламный блок (только для админов) -->
            <div id="adminAdSpot" class="admin-ad-spot" style="display: none;">
                <div class="ad-header">
                    <span class="ad-badge">Реклама</span>
                    <button class="btn-ad-edit" onclick="openAdEditor()">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
                <div id="adContent">
                    <!-- Рекламный контент будет здесь -->
                </div>
            </div>

            <!-- Список объявлений (оставляем как было) -->
            <div class="ads-container">
                <h3 class="section-title">Последние объявления</h3>
                <div id="adsList" class="ads-grid">
                    <!-- Объявления будут загружены через JS -->
                </div>
            </div>
        </main>

        <!-- Модальное окно создания объявления -->
        <div id="createAdModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Создать объявление</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="adForm">
                        <div class="form-group">
                            <label for="adTitle">Название товара</label>
                            <input type="text" id="adTitle" placeholder="Например: Vaporesso XROS 3" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="adCategory">Категория</label>
                            <select id="adCategory" required>
                                <option value="">Выберите категорию</option>
                                <option value="pod">Поды и POD-системы</option>
                                <option value="mod">Моды</option>
                                <option value="atomizer">Атомайзеры</option>
                                <option value="liquid">Жидкости</option>
                                <option value="accessories">Аксессуары</option>
                                <option value="other">Другое</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="adDescription">Описание</label>
                            <textarea id="adDescription" rows="4" placeholder="Опишите товар подробно..." required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="adPrice">Цена (₽)</label>
                            <input type="number" id="adPrice" placeholder="1000" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="adLocation">Город</label>
                            <input type="text" id="adLocation" placeholder="Москва" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Фотографии товара</label>
                            <div class="upload-area" id="uploadArea">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Перетащите фото сюда или нажмите для выбора</p>
                                <input type="file" id="photoUpload" accept="image/*" multiple style="display: none;">
                            </div>
                            <div id="previewContainer" class="preview-container"></div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary close-modal">Отмена</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i>
                                <span>Опубликовать</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Модальное окно жалобы -->
        <div id="reportModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Пожаловаться на объявление</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="reportForm">
                        <input type="hidden" id="reportAdId">
                        <div class="form-group">
                            <label for="reportReason">Причина жалобы</label>
                            <select id="reportReason" required>
                                <option value="">Выберите причину</option>
                                <option value="scam">Мошенничество</option>
                                <option value="fake">Фейковый товар</option>
                                <option value="spam">Спам</option>
                                <option value="rules">Нарушение правил</option>
                                <option value="other">Другое</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="reportDetails">Подробности</label>
                            <textarea id="reportDetails" rows="3" placeholder="Опишите проблему..."></textarea>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary close-modal">Отмена</button>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-flag"></i>
                                <span>Отправить жалобу</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Модальное окно рекламы -->
        <div id="adEditorModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Редактировать рекламу</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="adEditorForm">
                        <div class="form-group">
                            <label for="adTitleInput">Заголовок рекламы</label>
                            <input type="text" id="adTitleInput" placeholder="Заголовок">
                        </div>
                        
                        <div class="form-group">
                            <label for="adTextInput">Текст рекламы</label>
                            <textarea id="adTextInput" rows="3" placeholder="Текст рекламы"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="adLinkInput">Ссылка (если есть)</label>
                            <input type="url" id="adLinkInput" placeholder="https://example.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="adImageUpload">Изображение</label>
                            <input type="file" id="adImageUpload" accept="image/*">
                            <div id="adImagePreview" class="image-preview"></div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary close-modal">Отмена</button>
                            <button type="submit" class="btn btn-primary">Сохранить рекламу</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api/ads.js"></script>
    <script src="api/server-api.js"></script>
    <script src="app.js"></script>
    <script src="service-worker.js"></script>
</body>
</html>
