<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Market - Главная</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Навигация -->
        <nav class="navbar">
            <a href="index.html" class="logo">
                <i class="fas fa-smoking"></i>
                VapeMarket
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">
                    <i class="fas fa-home"></i> Главная
                </a>
                <a href="pages/profile.html" class="nav-link">
                    <i class="fas fa-user"></i> Кабинет
                </a>
                <a href="#" class="nav-link" id="createAdBtn">
                    <i class="fas fa-plus-circle"></i> Разместить
                </a>
                <a href="pages/faq.html" class="nav-link">
                    <i class="fas fa-question-circle"></i> FAQ
                </a>
                <a href="pages/admin-panel.html" class="nav-link" id="adminLink" style="display: none;">
                    <i class="fas fa-shield-alt"></i> Админ
                </a>
                <div class="user-avatar" id="userAvatar">
                    Г
                </div>
            </div>
        </nav>

        <!-- Рекламный баннер (только для админов) -->
        <div id="adminBanner" class="hidden" style="
            background: var(--gradient-secondary);
            color: white;
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        ">
            <i class="fas fa-star"></i> Акция! Скидка 15% на все жидкости до конца недели!
        </div>

        <!-- Фильтры -->
        <div class="filters" style="
            background: white;
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        ">
            <button class="btn btn-primary" data-filter="all">Все</button>
            <button class="btn btn-secondary" data-filter="sale">Продажа</button>
            <button class="btn btn-secondary" data-filter="buy">Покупка</button>
            <div style="margin-left: auto; display: flex; gap: 0.5rem;">
                <select class="form-select" style="width: auto;">
                    <option>Все категории</option>
                    <option>Жидкости</option>
                    <option>Устройства</option>
                    <option>Аксессуары</option>
                </select>
                <input type="text" class="form-input" placeholder="Поиск..." style="width: 200px;">
            </div>
        </div>

        <!-- Сетка объявлений -->
        <div class="ads-grid" id="adsGrid">
            <!-- Объявления загружаются через JavaScript -->
        </div>

        <!-- Пагинация -->
        <div class="pagination" style="
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        ">
            <button class="btn btn-secondary">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="btn btn-primary">1</button>
            <button class="btn btn-secondary">2</button>
            <button class="btn btn-secondary">3</button>
            <button class="btn btn-secondary">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- Модальное окно создания объявления -->
    <div class="modal" id="createAdModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="color: var(--dark-color);">Новое объявление</h2>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="adForm">
                <div class="form-group">
                    <label class="form-label">Тип сделки</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="radio" name="type" value="sell" checked>
                            <span>Продаю</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="radio" name="type" value="buy">
                            <span>Покупаю</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select class="form-select" name="category" required>
                        <option value="">Выберите категорию</option>
                        <option value="liquids">Жидкости</option>
                        <option value="devices">Устройства</option>
                        <option value="accessories">Аксессуары</option>
                        <option value="pods">Поды</option>
                        <option value="coils">Нагреватели</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Название товара</label>
                    <input type="text" class="form-input" name="title" 
                           placeholder="Например: Caliburn G3, H..." required>
                </div>

                <div class="form-group">
                    <label class="form-label">Цена (₽)</label>
                    <input type="number" class="form-input" name="price" 
                           placeholder="1000" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Загрузите фотографии (до 3 шт.)</label>
                    <div class="file-upload" id="fileUpload">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary-color);"></i>
                        <p style="margin: 1rem 0;">Перетащите файлы сюда или кликните для выбора</p>
                        <p style="color: #6b7280; font-size: 0.9rem;">
                            Поддерживаемые форматы: JPG, PNG, WebP
                        </p>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" multiple 
                           style="display: none;">
                    <div class="file-preview" id="filePreview"></div>
                    <p style="text-align: center; margin-top: 0.5rem; color: #6b7280;">
                        Выбрано: <span id="fileCount">0</span>/3
                    </p>
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="form-textarea" name="description" 
                              placeholder="Опишите состояние, характеристики, объем и т.д."></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">
                        Отмена
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Опубликовать
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно жалобы -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="color: var(--dark-color);">Пожаловаться на объявление</h2>
                <button class="modal-close" id="closeReportModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="reportForm">
                <div class="form-group">
                    <label class="form-label">Тип нарушения</label>
                    <select class="form-select" name="reportType" required>
                        <option value="">Выберите тип</option>
                        <optgroup label="Лёгкие нарушения">
                            <option value="spam">Спам / Реклама</option>
                            <option value="wrong_category">Неверная категория</option>
                        </optgroup>
                        <optgroup label="Средние нарушения">
                            <option value="fake">Недостоверная информация</option>
                            <option value="duplicate">Дубликат объявления</option>
                        </optgroup>
                        <optgroup label="Тяжёлые нарушения">
                            <option value="prohibited">Запрещённый товар</option>
                            <option value="scam">Мошенничество</option>
                            <option value="offensive">Оскорбительный контент</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Комментарий</label>
                    <textarea class="form-textarea" name="comment" 
                              placeholder="Опишите проблему подробнее..." required></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-secondary" id="cancelReportBtn">
                        Отмена
                    </button>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-flag"></i> Отправить жалобу
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="api/ads.js"></script>
</body>
</html>
