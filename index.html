<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Market | Барахолка для вейпов</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Стили -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Манифест PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7C3AED">
</head>
<body>
    <!-- Экран блокировки -->
    <div class="blocked-screen" id="blockedScreen" style="display: none;">
        <div class="blocked-icon">
            <i class="fas fa-ban"></i>
        </div>
        <div class="blocked-title">Аккаунт заблокирован</div>
        <div class="blocked-reason" id="blockedReason">Ваш аккаунт был временно заблокирован администратором</div>
        
        <div class="blocked-details">
            <div class="blocked-info-item">
                <span class="blocked-info-label">Причина:</span>
                <span class="blocked-info-value" id="blockReasonText">Нарушение правил</span>
            </div>
            <div class="blocked-info-item">
                <span class="blocked-info-label">Заблокирован:</span>
                <span class="blocked-info-value" id="blockDateText">Неизвестно</span>
            </div>
            <div class="blocked-info-item">
                <span class="blocked-info-label">Разблокировка:</span>
                <span class="blocked-info-value" id="unblockDateText">Неизвестно</span>
            </div>
            <div class="blocked-time-left" id="timeLeft">Осталось: --:--:--</div>
        </div>
        
        <div class="blocked-contact">
            Если вы считаете, что это ошибка, свяжитесь с администратором:
            <a href="https://t.me/nukm0" target="_blank">@nukm0</a>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <!-- Бейдж администратора -->
        <div class="admin-badge" id="adminBadge">
            <i class="fas fa-crown"></i>
            <span>Админ</span>
        </div>

        <!-- Шапка -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-smoking"></i>
                <span id="header-title">Vape Market</span>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main-content" id="main-content">
            <!-- Страница 1: Объявления (загружается динамически) -->
            <div class="page active" id="page-ads">
                <!-- Контент будет загружен динамически -->
            </div>

            <!-- Страница 2: Личный кабинет -->
            <div class="page" id="page-profile">
                <!-- Загружается из pages/profile.html -->
            </div>

            <!-- Страница 3: FAQ -->
            <div class="page" id="page-faq">
                <!-- Загружается из pages/faq.html -->
            </div>

            <!-- Страница 4: Админ-панель -->
            <div class="page" id="page-admin">
                <!-- Загружается из pages/admin.html -->
            </div>
        </main>

        <!-- Нижнее меню навигации -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="ads" onclick="switchPage('ads')">
                <div class="nav-icon">
                    <i class="fas fa-box-open"></i>
                </div>
                <span class="nav-label">Объявления</span>
            </button>
            
            <button class="nav-item" data-page="profile" onclick="switchPage('profile')">
                <div class="nav-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <span class="nav-label">Кабинет</span>
            </button>
            
            <button class="nav-item" data-page="faq" onclick="switchPage('faq')">
                <div class="nav-icon">
                    <i class="fas fa-question-circle"></i>
                </div>
                <span class="nav-label">FAQ</span>
            </button>
            
            <button class="nav-item" data-page="admin" onclick="switchPage('admin')" id="admin-nav-item" style="display: none;">
                <div class="nav-icon">
                    <i class="fas fa-crown"></i>
                </div>
                <span class="nav-label">Админ</span>
            </button>
        </nav>

        <!-- Модальное окно для просмотра фото -->
        <div class="photo-modal" id="photoModal">
            <button class="photo-modal-close" onclick="closePhotoModal()">
                <i class="fas fa-times"></i>
            </button>
            <div class="photo-modal-nav">
                <button class="photo-modal-nav-btn" onclick="prevPhoto()">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="photo-modal-nav-btn" onclick="nextPhoto()">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <img class="photo-modal-img" id="modalPhoto" src="" alt="Просмотр фото">
            <div class="photo-modal-counter" id="photoCounter">1 / 1</div>
        </div>

        <!-- Уведомление -->
        <div class="notification" id="notification"></div>
    </div>

    <!-- Подключение скриптов -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="api/server-api.js"></script>
    <script src="assets/js/app.js"></script>
    
    <!-- Service Worker для PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker зарегистрирован:', reg))
                .catch(err => console.log('Ошибка регистрации Service Worker:', err));
        }
    </script>
</body>
</html>
