<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Market - Главная</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-smoking"></i>
                    </div>
                    VapeMarket
                </a>
                
                <nav class="nav">
                    <a href="index.html" class="nav-link active">
                        <i class="fas fa-home"></i> Главная
                    </a>
                    <a href="pages/profile.html" class="nav-link">
                        <i class="fas fa-user"></i> Кабинет
                    </a>
                    <a href="pages/faq.html" class="nav-link">
                        <i class="fas fa-question-circle"></i> FAQ
                    </a>
                    <a href="pages/admin-panel.html" class="nav-link" id="adminLink" style="display: none;">
                        <i class="fas fa-shield-alt"></i> Админ
                    </a>
                    
                    <button class="create-ad-btn" id="createAdBtn">
                        <i class="fas fa-plus"></i> Разместить
                    </button>
                    
                    <div class="user-avatar" id="userAvatar" title="Гость">
                        Г
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Рекламный баннер (только для админа) -->
            <div id="adminBanner" class="hidden" style="
                background: var(--gradient-primary);
                color: white;
                padding: 16px;
                border-radius: var(--radius-lg);
                margin-bottom: 24px;
                text-align: center;
                font-weight: 500;
                border: 1px solid rgba(255, 255, 255, 0.1);
            ">
                <i class="fas fa-star"></i> Акция! Скидка 15% на все жидкости до конца недели!
            </div>

            <!-- Фильтры -->
            <div class="categories">
                <button class="category-btn active" data-filter="all">Все</button>
                <button class="category-btn" data-filter="sale">Продажа</button>
                <button class="category-btn" data-filter="buy">Покупка</button>
                <button class="category-btn">Жидкости</button>
                <button class="category-btn">Устройства</button>
                <button class="category-btn">Аксессуары</button>
            </div>

            <!-- Сетка объявлений -->
            <div class="ads-grid" id="adsGrid">
                <!-- Объявления будут загружены через JS -->
            </div>

            <!-- Пагинация -->
            <div class="text-center mt-6">
                <div style="display: inline-flex; gap: 8px; background: var(--bg-card); padding: 8px; border-radius: var(--radius-full); border: 1px solid var(--border);">
                    <button class="btn btn-secondary">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="btn btn-primary">1</button>
                    <button class="btn btn-secondary">2</button>
                    <button class="btn btn-secondary">3</button>
                    <button class="btn btn-secondary">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно создания объявления -->
    <div class="modal-overlay" id="createAdModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i class="fas fa-plus-circle"></i> Новое объявление
                </h3>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <form id="adForm">
                    <div class="form-group">
                        <label class="form-label">Тип сделки</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="type" value="sell" checked>
                                <span>Продаю</span>
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="type" value="buy">
                                <span>Покупаю</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Категория</label>
                        <select class="form-select" name="category" required>
                            <option value="">Выберите категорию</option>
                            <option value="liquids">Жидкости</option>
                            <option value="devices">Устройства</option>
                            <option value="accessories">Аксессуары</option>
                            <option value="pods">Поды</option>
                            <option value="coils">Нагреватели</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Название товара</label>
                        <input type="text" class="form-input" name="title" 
                               placeholder="Например: Caliburn G3, H..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Цена (₽)</label>
                        <input type="number" class="form-input" name="price" 
                               placeholder="1000" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Фотографии (до 3 шт.)</label>
                        <div class="file-upload-area" id="fileUpload">
                            <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: var(--primary); margin-bottom: 16px;"></i>
                            <p>Перетащите файлы сюда или кликните для выбора</p>
                            <p class="text-muted mt-2">JPG, PNG, WebP (макс. 5MB)</p>
                        </div>
                        <input type="file" id="fileInput" accept="image/*" multiple 
                               style="display: none;">
                        <div class="file-preview" id="filePreview"></div>
                        <p class="text-center mt-2">
                            Выбрано: <span id="fileCount">0</span>/3
                        </p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Описание</label>
                        <textarea class="form-textarea" name="description" 
                                  placeholder="Опишите состояние, характеристики, объем и т.д." rows="4"></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelBtn">
                    Отмена
                </button>
                <button type="submit" class="btn btn-primary" form="adForm">
                    <i class="fas fa-paper-plane"></i> Опубликовать
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно жалобы -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i class="fas fa-flag"></i> Пожаловаться
                </h3>
                <button class="modal-close" id="closeReportModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <form id="reportForm">
                    <div class="form-group">
                        <label class="form-label">Тип нарушения</label>
                        <select class="form-select" name="reportType" required>
                            <option value="">Выберите тип</option>
                            <optgroup label="Лёгкие нарушения">
                                <option value="spam">Спам / Реклама</option>
                                <option value="wrong_category">Неверная категория</option>
                            </optgroup>
                            <optgroup label="Средние нарушения">
                                <option value="fake">Недостоверная информация</option>
                                <option value="duplicate">Дубликат объявления</option>
                            </optgroup>
                            <optgroup label="Тяжёлые нарушения">
                                <option value="prohibited">Запрещённый товар</option>
                                <option value="scam">Мошенничество</option>
                                <option value="offensive">Оскорбительный контент</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Комментарий</label>
                        <textarea class="form-textarea" name="comment" 
                                  placeholder="Опишите проблему подробнее..." rows="3" required></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelReportBtn">
                    Отмена
                </button>
                <button type="submit" class="btn btn-danger" form="reportForm">
                    <i class="fas fa-paper-plane"></i> Отправить жалобу
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="api/ads.js"></script>
</body>
</html>
