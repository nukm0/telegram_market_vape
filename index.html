<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Market Vape</title>
    <link rel="stylesheet" href="styla.css">
    <link rel="manifest" href="manifest.json">
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- Главный скрипт приложения -->
    <script src="app.js?v=6.0"></script>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <div class="logo">
                <h1>Vape Market</h1>
            </div>
            <div class="user-info">
                <span id="userName">Загрузка...</span>
                <button id="profileBtn" class="btn-icon">👤</button>
                <button id="faqBtn" class="btn-icon">❓</button>
            </div>
        </header>

        <!-- Поиск и фильтры -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Поиск товаров..." class="search-input">
            <button id="refreshBtn" class="btn-secondary">🔄 Обновить</button>
        </div>

        <!-- Категории -->
        <div class="categories-section">
            <h2>Категории</h2>
            <div id="categories" class="categories-grid">
                <!-- Категории будут загружены через JS -->
            </div>
        </div>

        <!-- Товары -->
        <div class="items-section">
            <div class="section-header">
                <h2>Товары</h2>
                <span id="itemsCount" class="counter">0</span>
            </div>
            <div id="itemsGrid" class="items-grid">
                <!-- Товары будут загружены через JS -->
                <div class="loading">Загрузка товаров...</div>
            </div>
        </div>

        <!-- Навигация (для мобильных) -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-page="home">
                <span>🏠</span>
                <span>Главная</span>
            </button>
            <button class="nav-btn" data-page="categories">
                <span>📂</span>
                <span>Категории</span>
            </button>
            <button class="nav-btn" id="cartBtnNav" data-page="cart">
                <span>🛒</span>
                <span>Корзина</span>
            </button>
            <button class="nav-btn" data-page="profile">
                <span>👤</span>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Service Worker для PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('service-worker.js')
                    .then(function(registration) {
                        console.log('Service Worker зарегистрирован:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('Ошибка регистрации Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
