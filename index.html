<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vape Market</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase COMPAT версия (глобальная) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Структура приложения -->
    <div id="loader" class="loading" style="display: none;">Загрузка...</div>
    
    <!-- Навигация -->
    <div class="nav-buttons">
        <button id="navMain">🏠 Главная</button>
        <button id="navProfile">👤 Профиль</button>
        <button id="navFAQ">❓ Помощь</button>
    </div>
    
    <!-- Основные экраны -->
    <div id="mainScreen">
        <h1>Vape Market</h1>
        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn" data-category="all">Все</button>
            <button class="filter-btn" data-category="Жидкости">Жидкость</button>
            <button class="filter-btn" data-category="Одноразовые">Одноразово</button>
            <button class="filter-btn" data-category="Под-системы">Под-системы</button>
            <button class="filter-btn" data-category="Расходники">Расходники</button>
        </div>
        <!-- Кнопка создания -->
        <button id="createAdBtn" class="btn-create">+ Новое объявление</button>
        <!-- Контейнер объявлений -->
        <div id="adsContainer"></div>
    </div>
    
    <div id="profileScreen" style="display: none;">
        <h1>Мой профиль</h1>
        <div id="profileContent"></div>
    </div>
    
    <div id="faqScreen" style="display: none;">
        <h1>Помощь и FAQ</h1>
        <div id="faqContent"></div>
    </div>
    
    <div id="adminScreen" style="display: none;">
        <h1>Админ-панель</h1>
        <div id="adminContent"></div>
    </div>
    
    <!-- Подключение скриптов -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
