<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Market Vape</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <!-- Шапка с улучшениями -->
        <header class="header">
            <div class="logo">
                <h1>Vape Market</h1>
                <small style="color: var(--text-secondary);">Безопасные сделки в Telegram</small>
            </div>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <span id="userName">Загрузка...</span>
                <button id="profileBtn" class="btn-icon" title="Профиль">
                    <i class="fas fa-user-cog"></i>
                </button>
                <button id="createAdBtn" class="btn-icon" title="Разместить объявление">
                    <i class="fas fa-plus"></i>
                </button>
                <button id="faqBtn" class="btn-icon" title="Помощь">
                    <i class="fas fa-question"></i>
                </button>
            </div>
        </header>

        <!-- Улучшенная панель поиска -->
        <div class="search-section">
            <div class="search-container" style="flex: 1; position: relative;">
                <input type="text" id="searchInput" placeholder="🔍 Поиск жидкостей, устройств, аксессуаров..." 
                       class="search-input">
                <div id="searchFilters" style="display: none; margin-top: 10px;">
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">Все категории</option>
                        <option value="liquids">Жидкости</option>
                        <option value="disposable">Одноразовые</option>
                        <option value="pod">Под-системы</option>
                        <option value="consumables">Расходники</option>
                    </select>
                    <select id="dealTypeFilter" class="filter-select">
                        <option value="all">Все типы</option>
                        <option value="sell">Продают</option>
                        <option value="buy">Покупают</option>
                    </select>
                </div>
            </div>
            <button id="toggleFilters" class="btn-secondary">
                <i class="fas fa-filter"></i>
            </button>
            <button id="refreshBtn" class="btn-secondary" title="Обновить">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- Быстрые действия -->
        <div class="quick-actions" style="display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto;">
            <button class="quick-btn" data-action="create-ad">
                <i class="fas fa-plus-circle"></i>
                Разместить
            </button>
            <button class="quick-btn" data-action="my-ads">
                <i class="fas fa-box-open"></i>
                Мои объявления
            </button>
            <button class="quick-btn" data-action="favorites">
                <i class="fas fa-heart"></i>
                Избранное
            </button>
            <button class="quick-btn" data-action="recent">
                <i class="fas fa-history"></i>
                Недавние
            </button>
        </div>

        <!-- Категории -->
        <div class="categories-section">
            <h2>Категории <span id="categoryCount" class="counter">0</span></h2>
            <div id="categories" class="categories-grid">
                <div class="loading">Загрузка категорий...</div>
            </div>
        </div>

        <!-- Объявления -->
        <div class="items-section">
            <div class="section-header">
                <div>
                    <h2>Объявления <span id="itemsCount" class="counter">0</span></h2>
                    <small style="color: var(--text-secondary);">Новые сначала</small>
                </div>
                <div class="sort-options">
                    <select id="sortSelect" class="sort-select">
                        <option value="newest">Сначала новые</option>
                        <option value="cheapest">Сначала дешевые</option>
                        <option value="expensive">Сначала дорогие</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </div>
            </div>
            <div id="itemsGrid" class="items-grid">
                <div class="loading">Загрузка объявлений...</div>
            </div>
        </div>

        <!-- Пагинация -->
        <div class="pagination" id="pagination" style="display: none;">
            <button class="page-btn" id="prevPage">← Назад</button>
            <span class="page-info" id="pageInfo">Страница 1 из 1</span>
            <button class="page-btn" id="nextPage">Вперед →</button>
        </div>

        <!-- Навигация -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-page="home">
                <i class="fas fa-home"></i>
                <span>Главная</span>
            </button>
            <button class="nav-btn" data-page="search" id="searchBtnNav">
                <i class="fas fa-search"></i>
                <span>Поиск</span>
            </button>
            <button class="nav-btn" data-page="create">
                <i class="fas fa-plus-circle"></i>
                <span>Разместить</span>
            </button>
            <button class="nav-btn" data-page="favorites">
                <i class="fas fa-heart"></i>
                <span>Избранное</span>
            </button>
            <button class="nav-btn" data-page="profile" id="profileBtnNav">
                <i class="fas fa-user"></i>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Модальное окно объявления -->
    <div id="adModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <!-- Контент будет заполняться динамически -->
        </div>
    </div>

    <!-- Уведомления -->
    <div id="notificationContainer"></div>

    <!-- Скрипты -->
    <script src="config.js"></script>
    <script src="app.js?v=8.0"></script>
    
    <script>
        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('✅ Service Worker зарегистрирован'))
                .catch(err => console.log('❌ Ошибка регистрации:', err));
        }
    </script>
</body>
</html>
