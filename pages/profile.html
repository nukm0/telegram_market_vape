<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Vape Market</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Стили для личного кабинета */
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(107, 33, 168, 0.2), rgba(147, 51, 234, 0.1));
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6B21A8, #9333EA);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }
        
        .user-info h1 {
            margin: 0;
            font-size: 1.8rem;
            color: white;
        }
        
        .user-info p {
            color: #CBD5E1;
            margin: 5px 0;
        }
        
        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(251, 191, 36, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            color: #FBBF24;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(34, 197, 94, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            color: #4ADE80;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(30, 27, 75, 0.6);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #C084FC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #94A3B8;
            font-size: 0.9rem;
        }
        
        .section-title {
            color: white;
            font-size: 1.3rem;
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .my-ads-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .ad-item {
            background: rgba(30, 27, 75, 0.6);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            transition: all 0.3s ease;
        }
        
        .ad-item:hover {
            border-color: rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
        }
        
        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .ad-title {
            font-weight: 600;
            color: white;
            font-size: 1.1rem;
        }
        
        .ad-meta {
            display: flex;
            gap: 15px;
            color: #94A3B8;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .ad-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn-small {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60A5FA;
        }
        
        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #F87171;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94A3B8;
        }
        
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .ref-link {
            background: rgba(168, 85, 247, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        
        .ref-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .ref-input input {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 10px;
            color: white;
            font-family: inherit;
        }
        
        .ref-input button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #6B21A8, #9333EA);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .ref-input button:hover {
            transform: translateY(-2px);
        }
        
        .history-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: rgba(30, 27, 75, 0.6);
            border-radius: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(168, 85, 247, 0.1);
        }
        
        .history-time {
            color: #94A3B8;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        
        .history-content {
            flex: 1;
            color: #CBD5E1;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <!-- Шапка профиля -->
        <div class="profile-header">
            <div class="avatar" id="userAvatar">
                👤
            </div>
            <div class="user-info">
                <h1 id="userName">Анонимный</h1>
                <p id="userUsername">@anonymous</p>
                <div>
                    <span class="rating-badge">
                        ⭐ <span id="userRating">0.1</span>
                    </span>
                    <span class="verified-badge" id="verifiedBadge" style="display: none;">
                        ✅ Проверенный
                    </span>
                </div>
            </div>
        </div>

        <!-- Статистика -->
        <div class="section-title">
            📊 Моя статистика
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalLikes">0</div>
                <div class="stat-label">Лайков</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalDislikes">0</div>
                <div class="stat-label">Дизлайков</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeAds">0</div>
                <div class="stat-label">Активных объявлений</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalViews">0</div>
                <div class="stat-label">Просмотров</div>
            </div>
        </div>

        <!-- Реферальная ссылка -->
        <div class="ref-link">
            <div class="section-title" style="margin: 0 0 10px 0;">
                🔗 Реферальная ссылка
            </div>
            <p style="color: #CBD5E1; margin-bottom: 15px;">
                Пригласите друзей и получите бонусы!
            </p>
            <div class="ref-input">
                <input type="text" id="refLink" readonly value="Загрузка...">
                <button onclick="copyRefLink()">Копировать</button>
            </div>
        </div>

        <!-- Мои объявления -->
        <div class="section-title">
            🛒 Мои объявления
        </div>
        
        <div id="myAdsContainer" class="my-ads-list">
            <!-- Объявления будут загружены здесь -->
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>У вас пока нет объявлений</p>
            </div>
        </div>

        <!-- История просмотров -->
        <div class="section-title">
            📜 История просмотров
        </div>
        
        <div id="historyContainer">
            <!-- История будет загружена здесь -->
            <div class="empty-state">
                <div class="empty-state-icon">👀</div>
                <p>Вы еще не просматривали объявления</p>
            </div>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav-container" style="position: fixed; bottom: 0; width: 100%;">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='../index.html'">
                🏠 Главная
            </button>
            <button class="nav-btn" onclick="window.location.href='create-ad.html'">
                ➕ Разместить
            </button>
            <button class="nav-btn active">
                👤 Кабинет
            </button>
            <button class="nav-btn" onclick="window.location.href='faq.html'">
                ❓ Помощь
            </button>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let userProfile = null;
        let userAds = [];
        let viewHistory = [];

        // Инициализация профиля
        async function initProfile() {
            showLoader(true);
            
            try {
                // Получаем данные пользователя
                const tg = window.Telegram?.WebApp;
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    userProfile = {
                        id: user.id,
                        firstName: user.first_name || 'Анонимный',
                        lastName: user.last_name || '',
                        username: user.username || `user_${user.id}`,
                        photoUrl: user.photo_url
                    };
                    
                    // Обновляем UI
                    updateProfileUI();
                    
                    // Загружаем данные пользователя
                    await loadUserData();
                    await loadUserAds();
                    await loadViewHistory();
                } else {
                    // Тестовые данные для разработки
                    userProfile = {
                        id: 998579758,
                        firstName: "Иван",
                        lastName: "Иванов",
                        username: "test_user_998579758",
                        rating: 4.2,
                        isVerified: true,
                        totalLikes: 42,
                        totalDislikes: 3,
                        totalViews: 1250,
                        joinDate: "2024-01-15"
                    };
                    
                    updateProfileUI();
                    loadMockData();
                }
            } catch (error) {
                console.error('Ошибка инициализации профиля:', error);
                showError('Не удалось загрузить профиль');
            } finally {
                showLoader(false);
            }
        }

        // Обновление UI профиля
        function updateProfileUI() {
            if (!userProfile) return;
            
            document.getElementById('userName').textContent = 
                userProfile.firstName + (userProfile.lastName ? ` ${userProfile.lastName}` : '');
            
            document.getElementById('userUsername').textContent = 
                userProfile.username.startsWith('@') ? userProfile.username : `@${userProfile.username}`;
            
            if (userProfile.rating) {
                document.getElementById('userRating').textContent = userProfile.rating.toFixed(1);
            }
            
            if (userProfile.isVerified) {
                document.getElementById('verifiedBadge').style.display = 'inline-flex';
            }
            
            if (userProfile.photoUrl) {
                document.getElementById('userAvatar').style.backgroundImage = `url(${userProfile.photoUrl})`;
                document.getElementById('userAvatar').textContent = '';
            }
        }

        // Загрузка данных пользователя
        async function loadUserData() {
            // Здесь будет API запрос
            // Пока используем мок данные
            const stats = {
                totalLikes: userProfile.totalLikes || 42,
                totalDislikes: userProfile.totalDislikes || 3,
                activeAds: 3,
                totalViews: userProfile.totalViews || 1250
            };
            
            document.getElementById('totalLikes').textContent = stats.totalLikes;
            document.getElementById('totalDislikes').textContent = stats.totalDislikes;
            document.getElementById('activeAds').textContent = stats.activeAds;
            document.getElementById('totalViews').textContent = stats.totalViews.toLocaleString();
            
            // Генерируем реферальную ссылку
            const refLink = `https://t.me/vape_market_bot?start=ref_${userProfile.id}`;
            document.getElementById('refLink').value = refLink;
        }

        // Загрузка объявлений пользователя
        async function loadUserAds() {
            const adsContainer = document.getElementById('myAdsContainer');
            
            // Мок данные для разработки
            userAds = [
                {
                    id: 'ad_1',
                    title: 'Pod Elf Bar 5000',
                    description: 'Новый, в упаковке',
                    price: 2500,
                    category: 'Одноразовые',
                    type: 'sell',
                    createdAt: '2024-01-20',
                    views: 125,
                    likes: 12,
                    dislikes: 1
                },
                {
                    id: 'ad_2',
                    title: 'Жидкость для парения',
                    description: 'Вкус манго, крепость 3mg',
                    price: 800,
                    category: 'Жидкости',
                    type: 'sell',
                    createdAt: '2024-01-18',
                    views: 89,
                    likes: 8,
                    dislikes: 0
                },
                {
                    id: 'ad_3',
                    title: 'Хочу купить Vaporesso',
                    description: 'Ищу в хорошем состоянии',
                    price: 3000,
                    category: 'Под-системы',
                    type: 'buy',
                    createdAt: '2024-01-15',
                    views: 67,
                    likes: 5,
                    dislikes: 1
                }
            ];
            
            if (userAds.length === 0) {
                return;
            }
            
            // Очищаем контейнер
            adsContainer.innerHTML = '';
            
            // Добавляем объявления
            userAds.forEach(ad => {
                const adElement = document.createElement('div');
                adElement.className = 'ad-item';
                adElement.innerHTML = `
                    <div class="ad-header">
                        <div class="ad-title">${ad.title}</div>
                        <div style="color: ${ad.type === 'sell' ? '#4ADE80' : '#60A5FA'}; font-weight: 500;">
                            ${ad.type === 'sell' ? 'Продажа' : 'Покупка'}
                        </div>
                    </div>
                    <div class="ad-meta">
                        <span>${ad.category}</span>
                        <span>${ad.price} ₽</span>
                        <span>${ad.views} просмотров</span>
                    </div>
                    <p style="color: #CBD5E1; margin: 10px 0;">${ad.description}</p>
                    <div class="ad-actions">
                        <button class="btn-small btn-edit" onclick="editAd('${ad.id}')">
                            ✏️ Редактировать
                        </button>
                        <button class="btn-small btn-delete" onclick="deleteAd('${ad.id}')">
                            🗑️ Удалить
                        </button>
                    </div>
                `;
                adsContainer.appendChild(adElement);
            });
        }

        // Загрузка истории просмотров
        async function loadViewHistory() {
            const historyContainer = document.getElementById('historyContainer');
            
            // Мок данные
            viewHistory = [
                {
                    id: 'view_1',
                    adId: 'ad_123',
                    adTitle: 'GeekVape Aegis Legend 2',
                    timestamp: new Date(Date.now() - 3600000).toISOString(),
                    type: 'view'
                },
                {
                    id: 'view_2',
                    adId: 'ad_456',
                    adTitle: 'Жидкость Bad Drip',
                    timestamp: new Date(Date.now() - 7200000).toISOString(),
                    type: 'view'
                },
                {
                    id: 'view_3',
                    adId: 'ad_789',
                    adTitle: 'SMOK Nord 4',
                    timestamp: new Date(Date.now() - 86400000).toISOString(),
                    type: 'view'
                }
            ];
            
            if (viewHistory.length === 0) {
                return;
            }
            
            // Очищаем пустое состояние
            if (historyContainer.querySelector('.empty-state')) {
                historyContainer.innerHTML = '';
            }
            
            // Добавляем историю
            viewHistory.forEach(item => {
                const time = new Date(item.timestamp);
                const timeStr = time.toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                const itemElement = document.createElement('div');
                itemElement.className = 'history-item';
                itemElement.innerHTML = `
                    <div class="history-time">${timeStr}</div>
                    <div class="history-content">Просмотрено: "${item.adTitle}"</div>
                `;
                historyContainer.appendChild(itemElement);
            });
        }

        // Копирование реферальной ссылки
        function copyRefLink() {
            const refInput = document.getElementById('refLink');
            refInput.select();
            refInput.setSelectionRange(0, 99999);
            
            try {
                navigator.clipboard.writeText(refInput.value);
                showSuccess('Ссылка скопирована!');
            } catch (error) {
                document.execCommand('copy');
                showSuccess('Ссылка скопирована!');
            }
        }

        // Удаление объявления
        async function deleteAd(adId) {
            if (confirm('Вы уверены, что хотите удалить это объявление?')) {
                showLoader(true);
                
                try {
                    // Здесь будет API запрос
                    console.log('Удаление объявления:', adId);
                    
                    // Удаляем из локального массива
                    userAds = userAds.filter(ad => ad.id !== adId);
                    
                    // Перезагружаем список
                    await loadUserAds();
                    
                    showSuccess('Объявление удалено');
                } catch (error) {
                    console.error('Ошибка удаления:', error);
                    showError('Не удалось удалить объявление');
                } finally {
                    showLoader(false);
                }
            }
        }

        // Редактирование объявления
        function editAd(adId) {
            const ad = userAds.find(a => a.id === adId);
            if (ad) {
                alert(`Редактирование объявления: ${ad.title}\n\nЭта функция в разработке.`);
                // В будущем здесь будет открытие формы редактирования
            }
        }

        // Загрузка мок данных
        function loadMockData() {
            loadUserData();
            loadUserAds();
            loadViewHistory();
        }

        // Вспомогательные функции
        function showLoader(show) {
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            alert(`Ошибка: ${message}`);
        }

        function showSuccess(message) {
            alert(message);
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            initProfile();
            console.log('Страница профиля загружена');
        });
    </script>
</body>
</html>
