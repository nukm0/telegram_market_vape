<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Vape Market</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Шапка (такая же как в index.html) -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Vape Market</h1>
                <nav class="nav-menu">
                    <a href="../index.html" class="nav-item">
                        <i class="fas fa-home"></i>
                        <span>Главная</span>
                    </a>
                    <a href="profile.html" class="nav-item active">
                        <i class="fas fa-user"></i>
                        <span>Профиль</span>
                    </a>
                    <a href="faq.html" class="nav-item">
                        <i class="fas fa-question-circle"></i>
                        <span>FAQ</span>
                    </a>
                    <div id="adminPanelNav" style="display: none;">
                        <a href="admin.html" class="nav-item">
                            <i class="fas fa-shield-alt"></i>
                            <span>Админ-панель</span>
                        </a>
                    </div>
                </nav>
            </div>
        </header>

        <!-- Заголовок профиля -->
        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user" style="font-size: 50px; color: #667eea; line-height: 100px;"></i>
            </div>
            <h2 id="userName">Загрузка...</h2>
            <div class="user-rating">
                <div class="rating-stats">
                    <span class="rating-value" id="userRating">0%</span>
                    <div class="rating-stars">
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                    </div>
                </div>
                <div class="rating-counts">
                    <span class="like-count" id="likeCount">0 лайков</span>
                    <span class="dislike-count" id="dislikeCount">0 дизлайков</span>
                </div>
            </div>
        </div>

        <!-- Статистика профиля -->
        <div class="profile-stats">
            <div class="stat-card">
                <div class="stat-value" id="totalAds">0</div>
                <div class="stat-label">Объявления</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeAds">0</div>
                <div class="stat-label">Активные</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalViews">0</div>
                <div class="stat-label">Просмотры</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="soldItems">0</div>
                <div class="stat-label">Продано</div>
            </div>
        </div>

        <!-- Мои объявления -->
        <div class="ads-container">
            <div class="section-header">
                <h3>Мои объявления</h3>
                <button class="btn btn-primary" onclick="window.App.openCreateAdModal()">
                    <i class="fas fa-plus"></i>
                    <span>Новое объявление</span>
                </button>
            </div>
            <div id="myAdsList" class="ads-grid">
                <!-- Мои объявления будут здесь -->
            </div>
        </div>

        <!-- Настройки профиля -->
        <div class="admin-section">
            <h3>Настройки профиля</h3>
            <div class="settings-grid">
                <button class="btn btn-secondary" onclick="editProfile()">
                    <i class="fas fa-edit"></i>
                    <span>Редактировать профиль</span>
                </button>
                <button class="btn btn-secondary" onclick="changeAvatar()">
                    <i class="fas fa-camera"></i>
                    <span>Сменить аватар</span>
                </button>
                <button class="btn btn-secondary" onclick="showNotificationsSettings()">
                    <i class="fas fa-bell"></i>
                    <span>Уведомления</span>
                </button>
                <button class="btn btn-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Выйти</span>
                </button>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../api/ads.js"></script>
    <script src="../api/server-api.js"></script>
    <script src="../app.js"></script>
    <script>
        // Загрузка данных профиля
        document.addEventListener('DOMContentLoaded', async function() {
            const userId = localStorage.getItem('tg_user_id');
            const userName = localStorage.getItem('tg_user_name');
            
            if (!userId || userId === 'guest') {
                window.location.href = '../index.html';
                return;
            }
            
            // Устанавливаем имя
            document.getElementById('userName').textContent = userName;
            
            // Загружаем рейтинг
            const rating = await ServerAPI.getUserRating(userId);
            document.getElementById('userRating').textContent = `${rating.rating}%`;
            document.getElementById('likeCount').textContent = `${rating.likes} лайков`;
            document.getElementById('dislikeCount').textContent = `${rating.dislikes} дизлайков`;
            
            // Загружаем статистику
            await loadUserStats(userId);
            
            // Загружаем объявления пользователя
            await loadUserAds(userId);
            
            // Проверяем права доступа
            const userRole = localStorage.getItem('user_role');
            if (userRole === 'admin1' || userRole === 'admin2' || userRole === 'owner') {
                document.getElementById('adminPanelNav').style.display = 'block';
            }
        });
        
        // Загрузка статистики пользователя
        async function loadUserStats(userId) {
            try {
                const ads = await AdsAPI.getUserAds(userId);
                
                const totalAds = ads.length;
                const activeAds = ads.filter(ad => !ad.isBlocked).length;
                const totalViews = ads.reduce((sum, ad) => sum + (ad.views || 0), 0);
                const soldItems = ads.filter(ad => ad.status === 'sold').length;
                
                document.getElementById('totalAds').textContent = totalAds;
                document.getElementById('activeAds').textContent = activeAds;
                document.getElementById('totalViews').textContent = totalViews;
                document.getElementById('soldItems').textContent = soldItems;
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }
        
        // Загрузка объявлений пользователя
        async function loadUserAds(userId) {
            try {
                const ads = await AdsAPI.getUserAds(userId);
                const adsList = document.getElementById('myAdsList');
                
                if (!ads.length) {
                    adsList.innerHTML = `
                        <div class="no-ads" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                            <i class="fas fa-box-open" style="font-size: 48px; color: #667eea; margin-bottom: 15px;"></i>
                            <p style="color: #666; margin-bottom: 20px;">У вас пока нет объявлений</p>
                            <button class="btn btn-primary" onclick="window.App.openCreateAdModal()">
                                <i class="fas fa-plus"></i>
                                <span>Создать первое объявление</span>
                            </button>
                        </div>
                    `;
                    return;
                }
                
                adsList.innerHTML = ads.map(ad => createMyAdCard(ad)).join('');
                
                // Добавляем обработчики для кнопок
                ads.forEach(ad => {
                    const editBtn = document.getElementById(`editBtn_${ad.id}`);
                    const deleteBtn = document.getElementById(`deleteBtn_${ad.id}`);
                    
                    if (editBtn) {
                        editBtn.addEventListener('click', () => editAd(ad.id));
                    }
                    
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', () => deleteAd(ad.id));
                    }
                });
            } catch (error) {
                console.error('Ошибка загрузки объявлений:', error);
            }
        }
        
        // Создание карточки "моего" объявления
        function createMyAdCard(ad) {
            const hasImage = ad.images && ad.images.length > 0;
            const imageUrl = hasImage ? ad.images[0] : '';
            const isBlocked = ad.isBlocked;
            
            return `
                <div class="ad-card ${isBlocked ? 'blocked' : ''}" data-ad-id="${ad.id}">
                    ${isBlocked ? 
                        `<div class="ad-blocked-banner">
                            <i class="fas fa-ban"></i>
                            <span>Заблокировано</span>
                        </div>` : ''
                    }
                    <div class="ad-image-container">
                        ${hasImage ? 
                            `<img src="${imageUrl}" alt="${ad.title}" class="ad-image">` : 
                            `<div class="no-image">
                                <i class="fas fa-camera"></i>
                                <p>Нет фото</p>
                            </div>`
                        }
                    </div>
                    <div class="ad-content">
                        <h3 class="ad-title">${ad.title}</h3>
                        <div class="ad-price">${ad.price} ₽</div>
                        <div class="ad-meta">
                            <span class="ad-views">
                                <i class="fas fa-eye"></i>
                                ${ad.views || 0}
                            </span>
                            <span class="ad-date">
                                <i class="fas fa-calendar"></i>
                                ${new Date(ad.createdAt).toLocaleDateString()}
                            </span>
                        </div>
                        <div class="ad-actions">
                            <button class="btn btn-primary btn-small" id="editBtn_${ad.id}">
                                <i class="fas fa-edit"></i>
                                Редактировать
                            </button>
                            <button class="btn btn-danger btn-small" id="deleteBtn_${ad.id}">
                                <i class="fas fa-trash"></i>
                                Удалить
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Редактирование объявления
        function editAd(adId) {
            alert('Редактирование объявления ID: ' + adId);
            // Здесь должна быть реализация редактирования
        }
        
        // Удаление объявления
        async function deleteAd(adId) {
            if (!confirm('Вы уверены, что хотите удалить это объявление?')) {
                return;
            }
            
            try {
                const userId = localStorage.getItem('tg_user_id');
                const success = await AdsAPI.deleteAd(adId, userId);
                
                if (success) {
                    alert('Объявление удалено');
                    await loadUserAds(userId);
                    await loadUserStats(userId);
                } else {
                    alert('Ошибка при удалении объявления');
                }
            } catch (error) {
                console.error('Ошибка удаления объявления:', error);
                alert('Ошибка при удалении объявления');
            }
        }
        
        // Другие функции профиля
        function editProfile() {
            alert('Функция редактирования профиля будет реализована позже');
        }
        
        function changeAvatar() {
            alert('Функция смены аватара будет реализована позже');
        }
        
        function showNotificationsSettings() {
            alert('Настройки уведомлений будут реализованы позже');
        }
        
        function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.clear();
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>
