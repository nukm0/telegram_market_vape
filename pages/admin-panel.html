<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель - Vape Market</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            padding: 80px 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
        }

        .admin-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-stat {
            background: rgba(30, 27, 75, 0.6);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            text-align: center;
        }

        .admin-stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #C084FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .admin-stat-label {
            color: #94A3B8;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .admin-tab {
            padding: 15px 25px;
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-radius: 15px;
            color: #94A3B8;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .admin-tab.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(124, 58, 237, 0.15) 100%);
            color: #FFFFFF;
            border-color: rgba(168, 85, 247, 0.4);
        }

        .admin-content {
            background: rgba(30, 27, 75, 0.6);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            min-height: 500px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 15px;
            background: rgba(168, 85, 247, 0.1);
            color: #C084FC;
            font-weight: 600;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #CBD5E1;
        }

        .data-table tr:hover {
            background: rgba(168, 85, 247, 0.05);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.2);
            color: #10B981;
        }

        .status-blocked {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #F59E0B;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-block {
            border-color: rgba(239, 68, 68, 0.3);
            color: #EF4444;
        }

        .btn-unblock {
            border-color: rgba(34, 197, 94, 0.3);
            color: #10B981;
        }

        .btn-delete {
            border-color: rgba(107, 114, 128, 0.3);
            color: #94A3B8;
        }

        .btn-edit {
            border-color: rgba(59, 130, 246, 0.3);
            color: #3B82F6;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-logo">
            <div class="logo-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Vape Market</h1>
        </div>
        <div class="admin-user">
            <div class="user-avatar" style="background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);">
                <i class="fas fa-crown"></i>
            </div>
            <span class="username">Суперадмин</span>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h2 class="admin-title">Панель управления</h2>
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                На главную
            </a>
        </div>

        <!-- Статистика -->
        <div class="admin-stats">
            <div class="admin-stat">
                <div class="admin-stat-number">1,248</div>
                <div class="admin-stat-label">Пользователей</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat-number">356</div>
                <div class="admin-stat-label">Объявлений</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat-number">42</div>
                <div class="admin-stat-label">Сегодня</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat-number">23</div>
                <div class="admin-stat-label">Жалоб</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat-number">5</div>
                <div class="admin-stat-label">Заблокировано</div>
            </div>
            <div class="admin-stat">
                <div class="admin-stat-number">3,856</div>
                <div class="admin-stat-label">Сделок</div>
            </div>
        </div>

        <!-- Вкладки -->
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchTab('reports')">
                <i class="fas fa-flag"></i>
                Жалобы
            </button>
            <button class="admin-tab" onclick="switchTab('users')">
                <i class="fas fa-users"></i>
                Пользователи
            </button>
            <button class="admin-tab" onclick="switchTab('ads')">
                <i class="fas fa-box-open"></i>
                Объявления
            </button>
            <button class="admin-tab" onclick="switchTab('advertising')">
                <i class="fas fa-ad"></i>
                Реклама
            </button>
            <button class="admin-tab" onclick="switchTab('moderation')">
                <i class="fas fa-gavel"></i>
                Модерация
            </button>
            <button class="admin-tab" onclick="switchTab('settings')">
                <i class="fas fa-cog"></i>
                Настройки
            </button>
            <button class="admin-tab" onclick="switchTab('logs')">
                <i class="fas fa-history"></i>
                Логи
            </button>
        </div>

        <!-- Контент -->
        <div class="admin-content" id="adminContent">
            <!-- Динамически загружается -->
        </div>
    </div>

    <script>
        // Загрузка данных админ панели
        document.addEventListener('DOMContentLoaded', function() {
            loadAdminReports();
        });

        function switchTab(tabName) {
            // Обновляем активные вкладки
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Загружаем контент
            switch(tabName) {
                case 'reports':
                    loadAdminReports();
                    break;
                case 'users':
                    loadAdminUsers();
                    break;
                case 'ads':
                    loadAdminAds();
                    break;
                case 'advertising':
                    loadAdminAdvertising();
                    break;
                case 'moderation':
                    loadAdminModeration();
                    break;
                case 'settings':
                    loadAdminSettings();
                    break;
                case 'logs':
                    loadAdminLogs();
                    break;
            }
        }

        function loadAdminReports() {
            const reports = JSON.parse(localStorage.getItem('reports') || '[]');
            
            document.getElementById('adminContent').innerHTML = `
                <h3 style="color: #FFFFFF; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-flag"></i>
                    Жалобы пользователей (${reports.length})
                </h3>
                
                ${reports.length === 0 ? `
                    <div style="text-align: center; padding: 60px 20px; color: #94A3B8;">
                        <i class="fas fa-flag" style="font-size: 48px; margin-bottom: 20px;"></i>
                        <h3 style="color: #CBD5E1;">Нет жалоб</h3>
                        <p>Здесь будут отображаться жалобы пользователей</p>
                    </div>
                ` : `
                    <div class="action-buttons" style="margin-bottom: 20px;">
                        <button class="action-btn btn-block" onclick="resolveAllReports()">
                            <i class="fas fa-check"></i>
                            Решить все
                        </button>
                        <button class="action-btn btn-delete" onclick="clearAllReports()">
                            <i class="fas fa-trash"></i>
                            Очистить все
                        </button>
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Объявление</th>
                                    <th>Продавец</th>
                                    <th>Причина</th>
                                    <th>Статус</th>
                                    <th>Дата</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${reports.map(report => `
                                    <tr>
                                        <td>${report.id.substring(0, 8)}...</td>
                                        <td>${report.adTitle}</td>
                                        <td>${report.sellerName}</td>
                                        <td>${getReportReason(report.reason)}</td>
                                        <td>
                                            <span class="status-badge ${getStatusClass(report.status)}">
                                                ${getReportStatus(report.status)}
                                            </span>
                                        </td>
                                        <td>${new Date(report.createdAt).toLocaleDateString('ru-RU')}</td>
                                        <td>
                                            <div class="action-buttons">
                                                ${report.status === 'pending' ? `
                                                    <button class="action-btn btn-edit" onclick="resolveReport('${report.id}')">
                                                        <i class="fas fa-check"></i>
                                                    </button>
                                                    <button class="action-btn btn-delete" onclick="rejectReport('${report.id}')">
                                                        <i class="fas fa-times"></i>
                                                    </button>
                                                ` : ''}
                                                <button class="action-btn btn-block" onclick="blockUser('${report.sellerId}', '${report.reason}')">
                                                    <i class="fas fa-ban"></i>
                                                </button>
                                                <button class="action-btn btn-delete" onclick="deleteReport('${report.id}')">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `}
            `;
        }

        // Вспомогательные функции
        function getReportStatus(status) {
            const statuses = {
                'pending': 'На рассмотрении',
                'resolved': 'Решено',
                'rejected': 'Отклонено'
            };
            return statuses[status] || status;
        }

        function getStatusClass(status) {
            const classes = {
                'pending': 'status-pending',
                'resolved': 'status-active',
                'rejected': 'status-blocked'
            };
            return classes[status] || '';
        }

        function getReportReason(reason) {
            const reasons = {
                'spam': 'Спам',
                'fraud': 'Мошенничество',
                'wrong_category': 'Неправильная категория',
                'prohibited': 'Запрещенные товары',
                'fake_price': 'Неверная цена',
                'other': 'Другое'
            };
            return reasons[reason] || reason;
        }

        // Действия админа
        function resolveReport(reportId) {
            updateReportStatus(reportId, 'resolved');
        }

        function rejectReport(reportId) {
            updateReportStatus(reportId, 'rejected');
        }

        function updateReportStatus(reportId, status) {
            let reports = JSON.parse(localStorage.getItem('reports') || '[]');
            const reportIndex = reports.findIndex(r => r.id === reportId);
            
            if (reportIndex !== -1) {
                reports[reportIndex].status = status;
                reports[reportIndex].resolvedAt = new Date().toISOString();
                localStorage.setItem('reports', JSON.stringify(reports));
                loadAdminReports();
                alert(`Жалоба ${status === 'resolved' ? 'решена' : 'отклонена'}`);
            }
        }

        function resolveAllReports() {
            if (confirm('Пометить все жалобы как решенные?')) {
                let reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports.forEach(report => {
                    report.status = 'resolved';
                    report.resolvedAt = new Date().toISOString();
                });
                localStorage.setItem('reports', JSON.stringify(reports));
                loadAdminReports();
                alert('Все жалобы помечены как решенные');
            }
        }

        function blockUser(userId, reason) {
            if (confirm(`Заблокировать пользователя? Причина: ${getReportReason(reason)}`)) {
                let blockedUsers = JSON.parse(localStorage.getItem('blockedUsers') || '{}');
                blockedUsers[userId] = {
                    blockedAt: new Date().toISOString(),
                    reason: reason,
                    expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString() // 30 дней
                };
                localStorage.setItem('blockedUsers', JSON.stringify(blockedUsers));
                alert('Пользователь заблокирован на 30 дней');
            }
        }

        function deleteReport(reportId) {
            if (confirm('Удалить эту жалобу?')) {
                let reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports = reports.filter(r => r.id !== reportId);
                localStorage.setItem('reports', JSON.stringify(reports));
                loadAdminReports();
                alert('Жалоба удалена');
            }
        }

        function clearAllReports() {
            if (confirm('Очистить все жалобы? Это действие нельзя отменить.')) {
                localStorage.removeItem('reports');
                loadAdminReports();
                alert('Все жалобы очищены');
            }
        }

        // Загрузка других вкладок
        function loadAdminUsers() {
            document.getElementById('adminContent').innerHTML = `
                <h3 style="color: #FFFFFF; margin-bottom: 20px;">
                    <i class="fas fa-users"></i>
                    Управление пользователями
                </h3>
                <p style="color: #94A3B8;">Функция в разработке...</p>
            `;
        }

        function loadAdminAdvertising() {
            document.getElementById('adminContent').innerHTML = `
                <h3 style="color: #FFFFFF; margin-bottom: 20px;">
                    <i class="fas fa-ad"></i>
                    Управление рекламой
                </h3>
                
                <div style="background: rgba(168, 85, 247, 0.1); padding: 20px; border-radius: 15px; margin-bottom: 20px;">
                    <h4 style="color: #C084FC; margin-bottom: 10px;">Рекламный баннер</h4>
                    <p style="color: #CBD5E1; margin-bottom: 15px;">
                        Баннер отображается на главной странице для всех пользователей.
                    </p>
                    
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label style="color: #CBD5E1; display: block; margin-bottom: 8px;">Заголовок</label>
                        <input type="text" id="adTitle" class="form-input" 
                               placeholder="Заголовок рекламы" value="Рекламное место">
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label style="color: #CBD5E1; display: block; margin-bottom: 8px;">Текст</label>
                        <textarea id="adText" class="form-textarea" 
                                  placeholder="Текст рекламы"
                                  rows="3">Текст рекламы здесь. Только для администраторов.</textarea>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label style="color: #CBD5E1; display: block; margin-bottom: 8px;">Цвет</label>
                        <select id="adColor" class="category-select">
                            <option value="purple">Фиолетовый</option>
                            <option value="blue">Синий</option>
                            <option value="green">Зеленый</option>
                            <option value="orange">Оранжевый</option>
                        </select>
                    </div>
                    
                    <button class="action-btn" onclick="saveAdBanner()" style="width: 100%;">
                        <i class="fas fa-save"></i>
                        Сохранить баннер
                    </button>
                </div>
                
                <div style="background: rgba(59, 130, 246, 0.1); padding: 20px; border-radius: 15px;">
                    <h4 style="color: #3B82F6; margin-bottom: 10px;">Статистика рекламы</h4>
                    <p style="color: #CBD5E1;">
                        Просмотров: <strong>15,432</strong><br>
                        Кликов: <strong>1,245</strong><br>
                        CTR: <strong>8.1%</strong>
                    </p>
                </div>
            `;
            
            // Загружаем текущие настройки
            const banner = JSON.parse(localStorage.getItem('adBanner') || '{"title":"Рекламное место","text":"Текст рекламы здесь"}');
            document.getElementById('adTitle').value = banner.title;
            document.getElementById('adText').value = banner.text;
        }

        function saveAdBanner() {
            const banner = {
                title: document.getElementById('adTitle').value,
                text: document.getElementById('adText').value,
                color: document.getElementById('adColor').value,
                updatedAt: new Date().toISOString()
            };
            
            localStorage.setItem('adBanner', JSON.stringify(banner));
            alert('✅ Рекламный баннер сохранен');
        }

        function loadAdminSettings() {
            document.getElementById('adminContent').innerHTML = `
                <h3 style="color: #FFFFFF; margin-bottom: 20px;">
                    <i class="fas fa-cog"></i>
                    Настройки системы
                </h3>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                    <!-- Настройки модерации -->
                    <div style="background: rgba(168, 85, 247, 0.1); padding: 20px; border-radius: 15px;">
                        <h4 style="color: #C084FC; margin-bottom: 15px;">Модерация</h4>
                        
                        <div class="setting-item" style="padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <span style="color: #CBD5E1;">Автомодерация объявлений</span>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        
                        <div class="setting-item" style="padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <span style="color: #CBD5E1;">Уведомлять о жалобах</span>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        
                        <div class="setting-item" style="padding: 15px 0;">
                            <span style="color: #CBD5E1;">Автоблокировка спамеров</span>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Настройки безопасности -->
                    <div style="background: rgba(239, 68, 68, 0.1); padding: 20px; border-radius: 15px;">
                        <h4 style="color: #EF4444; margin-bottom: 15px;">Безопасность</h4>
                        
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="color: #CBD5E1; display: block; margin-bottom: 8px;">Длительность блокировки</label>
                            <select class="category-select">
                                <option>1 день</option>
                                <option selected>7 дней</option>
                                <option>30 дней</option>
                                <option>Навсегда</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label style="color: #CBD5E1; display: block; margin-bottom: 8px;">Максимум жалоб для авто-блокировки</label>
                            <input type="number" class="form-input" value="3" min="1" max="10">
                        </div>
                    </div>
                    
                    <!-- Настройки уведомлений -->
                    <div style="background: rgba(34, 197, 94, 0.1); padding: 20px; border-radius: 15px;">
                        <h4 style="color: #10B981; margin-bottom: 15px;">Уведомления</h4>
                        
                        <div class="setting-item" style="padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <span style="color: #CBD5E1;">Уведомления на почту</span>
                            <label class="switch">
                                <input type="checkbox">
                                <span class="slider"></span>
                            </label>
                        </div>
                        
                        <div class="setting-item" style="padding: 15px 0;">
                            <span style="color: #CBD5E1;">Telegram уведомления</span>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                
                <div style="margin-top: 30px; text-align: center;">
                    <button class="action-btn" style="padding: 15px 30px; font-size: 1rem;">
                        <i class="fas fa-save"></i>
                        Сохранить все настройки
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
