<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Vape Market</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Vape Market</h1>
                <nav class="nav-menu">
                    <a href="../index.html" class="nav-item">
                        <i class="fas fa-home"></i>
                        <span>Главная</span>
                    </a>
                    <a href="profile.html" class="nav-item">
                        <i class="fas fa-user"></i>
                        <span>Профиль</span>
                    </a>
                    <a href="faq.html" class="nav-item">
                        <i class="fas fa-question-circle"></i>
                        <span>FAQ</span>
                    </a>
                    <a href="admin.html" class="nav-item active">
                        <i class="fas fa-shield-alt"></i>
                        <span>Админ-панель</span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- Приветствие админа -->
        <div class="banner admin-banner">
            <h2 id="adminGreeting">Админ-панель</h2>
            <p id="adminRole">Загрузка...</p>
        </div>

        <!-- Статистика -->
        <div class="admin-section">
            <h3>Общая статистика</h3>
            <div class="admin-stats-grid" id="adminStats">
                <!-- Статистика будет загружена через JS -->
            </div>
        </div>

        <!-- Уровни доступа -->
        <div id="adminContent">
            <!-- Содержимое загружается в зависимости от уровня доступа -->
        </div>
    </div>

    <!-- Модальное окно управления пользователями -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Управление пользователем</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label for="userNameInput">Имя пользователя</label>
                        <input type="text" id="userNameInput" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label for="userRoleSelect">Роль</label>
                        <select id="userRoleSelect">
                            <option value="user">Пользователь</option>
                            <option value="admin1">Модератор</option>
                            <option value="admin2">Администратор</option>
                            <option value="owner">Владелец</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="userStatus">Статус</label>
                        <div>
                            <button type="button" id="blockUserBtn" class="btn btn-danger">Заблокировать</button>
                            <button type="button" id="unblockUserBtn" class="btn btn-success" style="display: none;">Разблокировать</button>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary close-modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../api/ads.js"></script>
    <script src="../api/server-api.js"></script>
    <script src="../app.js"></script>
    <script>
        // Загрузка админ-панели
        document.addEventListener('DOMContentLoaded', async function() {
            const userId = localStorage.getItem('tg_user_id');
            const userRole = localStorage.getItem('user_role');
            
            // Проверяем права доступа
            if (!userRole || (userRole !== 'admin1' && userRole !== 'admin2' && userRole !== 'owner')) {
                window.location.href = '../index.html';
                return;
            }
            
            // Устанавливаем приветствие
            document.getElementById('adminGreeting').textContent = 
                `Админ-панель (${getRoleName(userRole)})`;
            document.getElementById('adminRole').textContent = 
                `Ваш уровень доступа: ${getRoleName(userRole)}`;
            
            // Загружаем статистику
            await loadAdminStats();
            
            // Загружаем контент в зависимости от уровня доступа
            await loadAdminContent(userRole);
            
            // Инициализируем обработчики событий
            initAdminEventListeners();
        });
        
        // Получение названия роли
        function getRoleName(role) {
            const roles = {
                admin1: 'Модератор',
                admin2: 'Администратор',
                owner: 'Владелец'
            };
            return roles[role] || 'Пользователь';
        }
        
        // Загрузка статистики
        async function loadAdminStats() {
            try {
                const stats = await ServerAPI.getStats();
                const statsContainer = document.getElementById('adminStats');
                
                statsContainer.innerHTML = `
                    <div class="admin-stat">
                        <div class="admin-stat-value">${stats.totalAds}</div>
                        <div class="admin-stat-label">Всего объявлений</div>
                    </div>
                    <div class="admin-stat">
                        <div class="admin-stat-value">${stats.activeAds}</div>
                        <div class="admin-stat-label">Активных</div>
                    </div>
                    <div class="admin-stat">
                        <div class="admin-stat-value">${stats.blockedAds}</div>
                        <div class="admin-stat-label">Заблокировано</div>
                    </div>
                    <div class="admin-stat">
                        <div class="admin-stat-value">${stats.totalUsers}</div>
                        <div class="admin-stat-label">Пользователей</div>
                    </div>
                    <div class="admin-stat">
                        <div class="admin-stat-value">${stats.pendingReports}</div>
                        <div class="admin-stat-label">Жалоб в ожидании</div>
                    </div>
                    <div class="admin-stat">
                        <div class="admin-stat-value">${stats.todayAds}</div>
                        <div class="admin-stat-label">Объявлений за сегодня</div>
                    </div>
                `;
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }
        
        // Загрузка контента админ-панели
        async function loadAdminContent(userRole) {
            const contentContainer = document.getElementById('adminContent');
            let contentHTML = '';
            
            // Все админы видят жалобы
            contentHTML += await loadReportsSection();
            
            // Админы admin1 и выше видят управление объявлениями
            if (userRole === 'admin1' || userRole === 'admin2' || userRole === 'owner') {
                contentHTML += await loadAdsManagementSection();
            }
            
            // Админы admin1 и выше видят управление пользователями
            if (userRole === 'admin1' || userRole === 'admin2' || userRole === 'owner') {
                contentHTML += await loadUsersManagementSection();
            }
            
            // Только admin2 и owner видят управление рекламой
            if (userRole === 'admin2' || userRole === 'owner') {
                contentHTML += await loadAdvertisementSection();
            }
            
            // Только owner видит управление админами
            if (userRole === 'owner') {
                contentHTML += await loadAdminsManagementSection();
            }
            
            contentContainer.innerHTML = contentHTML;
        }
        
        // Секция жалоб
        async function loadReportsSection() {
            try {
                const reports = await ServerAPI.getAllReports();
                const pendingReports = reports.filter(r => r.status === 'pending');
                
                return `
                    <div class="admin-section">
                        <h3>Жалобы на объявления (${pendingReports.length})</h3>
                        <div class="reports-list" id="reportsList">
                            ${pendingReports.length > 0 ? 
                                pendingReports.map(report => createReportItem(report)).join('') :
                                '<p class="no-data">Нет жалоб в ожидании</p>'
                            }
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Ошибка загрузки жалоб:', error);
                return '';
            }
        }
        
        // Создание элемента жалобы
        function createReportItem(report) {
            return `
                <div class="report-item" data-report-id="${report.id}">
                    <div class="report-header">
                        <strong>ID объявления: ${report.adId}</strong>
                        <span class="report-reason">${AppConfig.reportReasons[report.reason] || report.reason}</span>
                    </div>
                    <p class="report-details">${report.details || 'Без описания'}</p>
                    <div class="report-meta">
                        <small>От: ${report.reporterName}</small>
                        <small>${new Date(report.date).toLocaleString()}</small>
                    </div>
                    <div class="report-actions">
                        <button class="btn btn-primary btn-small" onclick="reviewReport('${report.id}')">
                            <i class="fas fa-eye"></i>
                            Просмотреть
                        </button>
                        <button class="btn btn-danger btn-small" onclick="processReport('${report.id}', 'rejected')">
                            <i class="fas fa-times"></i>
                            Отклонить
                        </button>
                    </div>
                </div>
            `;
        }
        
        // Секция управления объявлениями
        async function loadAdsManagementSection() {
            try {
                const ads = await AdsAPI.getAllAds();
                
                return `
                    <div class="admin-section">
                        <h3>Управление объявлениями (${ads.length})</h3>
                        <div class="ads-management">
                            <div class="search-bar">
                                <input type="text" id="adSearch" placeholder="Поиск по названию..." 
                                       onkeyup="searchAds()">
                            </div>
                            <div class="ads-list" id="adminAdsList">
                                ${ads.length > 0 ? 
                                    ads.map(ad => createAdminAdItem(ad)).join('') :
                                    '<p class="no-data">Нет объявлений</p>'
                                }
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Ошибка загрузки объявлений:', error);
                return '';
            }
        }
        
        // Создание элемента объявления для админа
        function createAdminAdItem(ad) {
            return `
                <div class="user-item ${ad.isBlocked ? 'blocked' : ''}" data-ad-id="${ad.id}">
                    <div class="user-info">
                        <div class="user-avatar">${ad.userName?.charAt(0) || 'U'}</div>
                        <div>
                            <strong>${ad.title}</strong>
                            <div>${ad.price} ₽ • ${ad.location}</div>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-secondary btn-small" onclick="viewAd('${ad.id}')">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn ${ad.isBlocked ? 'btn-success' : 'btn-danger'} btn-small" 
                                onclick="toggleAdBlock('${ad.id}', ${!ad.isBlocked})">
                            <i class="fas ${ad.isBlocked ? 'fa-unlock' : 'fa-ban'}"></i>
                            ${ad.isBlocked ? 'Разблокировать' : 'Заблокировать'}
                        </button>
                    </div>
                </div>
            `;
        }
        
        // Секция управления пользователями
        async function loadUsersManagementSection() {
            return `
                <div class="admin-section">
                    <h3>Управление пользователями</h3>
                    <div class="users-management">
                        <div class="search-bar">
                            <input type="text" id="userSearch" placeholder="Поиск пользователей..." 
                                   onkeyup="searchUsers()">
                        </div>
                        <div class="user-list" id="usersList">
                            <!-- Пользователи будут загружены динамически -->
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Секция управления рекламой
        async function loadAdvertisementSection() {
            return `
                <div class="admin-section">
                    <h3>Управление рекламой</h3>
                    <div class="ad-management">
                        <div class="ad-preview">
                            <h4>Предпросмотр рекламы</h4>
                            <div id="adPreview" style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin: 15px 0;">
                                <!-- Превью рекламы -->
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="window.App.openAdEditor()">
                            <i class="fas fa-edit"></i>
                            Редактировать рекламу
                        </button>
                    </div>
                </div>
            `;
        }
        
        // Секция управления админами (только для владельца)
        async function loadAdminsManagementSection() {
            return `
                <div class="admin-section">
                    <h3>Управление администраторами</h3>
                    <div class="admins-management">
                        <div class="admins-list" id="adminsList">
                            <!-- Список админов будет загружен динамически -->
                        </div>
                        <button class="btn btn-primary" onclick="addAdmin()">
                            <i class="fas fa-user-plus"></i>
                            Добавить администратора
                        </button>
                    </div>
                </div>
            `;
        }
        
        // Инициализация обработчиков событий
        function initAdminEventListeners() {
            // Кнопки закрытия модальных окон
            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.modal').forEach(modal => {
                        modal.classList.remove('active');
                    });
                });
            });
            
            // Форма управления пользователем
            const userForm = document.getElementById('userForm');
            if (userForm) {
                userForm.addEventListener('submit', handleUserFormSubmit);
            }
            
            // Кнопки блокировки/разблокировки
            const blockUserBtn = document.getElementById('blockUserBtn');
            const unblockUserBtn = document.getElementById('unblockUserBtn');
            
            if (blockUserBtn) {
                blockUserBtn.addEventListener('click', () => {
                    const userId = document.getElementById('userId').value;
                    blockUser(userId, true);
                });
            }
            
            if (unblockUserBtn) {
                unblockUserBtn.addEventListener('click', () => {
                    const userId = document.getElementById('userId').value;
                    blockUser(userId, false);
                });
            }
        }
        
        // Обработка жалобы
        async function processReport(reportId, action) {
            try {
                await ServerAPI.updateReportStatus(reportId, action);
                
                // Обновляем список жалоб
                await loadReportsSection();
                
                alert(`Жалоба ${action === 'rejected' ? 'отклонена' : 'обработана'}`);
            } catch (error) {
                console.error('Ошибка обработки жалобы:', error);
                alert('Ошибка при обработке жалобы');
            }
        }
        
        // Просмотр жалобы
        function reviewReport(reportId) {
            alert('Просмотр жалобы ID: ' + reportId);
            // Здесь должна быть реализация просмотра объявления
        }
        
        // Поиск объявлений
        function searchAds() {
            const searchTerm = document.getElementById('adSearch').value.toLowerCase();
            const adItems = document.querySelectorAll('[data-ad-id]');
            
            adItems.forEach(item => {
                const adTitle = item.querySelector('strong')?.textContent.toLowerCase() || '';
                const shouldShow = adTitle.includes(searchTerm);
                item.style.display = shouldShow ? 'flex' : 'none';
            });
        }
        
        // Просмотр объявления
        function viewAd(adId) {
            alert('Просмотр объявления ID: ' + adId);
            // Здесь должна быть реализация просмотра объявления
        }
        
        // Блокировка/разблокировка объявления
        async function toggleAdBlock(adId, isBlocked) {
            try {
                const success = await AdsAPI.toggleAdBlock(adId, isBlocked);
                
                if (success) {
                    alert(`Объявление ${isBlocked ? 'заблокировано' : 'разблокировано'}`);
                    location.reload(); // Перезагружаем страницу для обновления списка
                } else {
                    alert('Ошибка при изменении статуса объявления');
                }
            } catch (error) {
                console.error('Ошибка блокировки объявления:', error);
                alert('Ошибка при изменении статуса объявления');
            }
        }
        
        // Поиск пользователей
        async function searchUsers() {
            try {
                const searchTerm = document.getElementById('userSearch').value.toLowerCase();
                const users = await ServerAPI.getUsers();
                
                const usersList = document.getElementById('usersList');
                usersList.innerHTML = users
                    .filter(user => user.name?.toLowerCase().includes(searchTerm) || 
                                   user.id?.toLowerCase().includes(searchTerm))
                    .map(user => createUserItem(user))
                    .join('');
            } catch (error) {
                console.error('Ошибка поиска пользователей:', error);
            }
        }
        
        // Создание элемента пользователя
        function createUserItem(user) {
            return `
                <div class="user-item ${user.isBlocked ? 'blocked' : ''}" data-user-id="${user.id}">
                    <div class="user-info">
                        <div class="user-avatar">${user.name?.charAt(0) || 'U'}</div>
                        <div>
                            <strong>${user.name || 'Без имени'}</strong>
                            <div>ID: ${user.id}</div>
                        </div>
                    </div>
                    <div class="user-status ${user.isBlocked ? 'status-blocked' : 'status-active'}">
                        ${user.isBlocked ? 'Заблокирован' : 'Активен'}
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-primary btn-small" onclick="openUserModal('${user.id}')">
                            <i class="fas fa-cog"></i>
                            Управление
                        </button>
                    </div>
                </div>
            `;
        }
        
        // Открытие модального окна пользователя
        async function openUserModal(userId) {
            try {
                const users = await ServerAPI.getUsers();
                const user = users.find(u => u.id === userId);
                
                if (!user) {
                    alert('Пользователь не найден');
                    return;
                }
                
                document.getElementById('userId').value = user.id;
                document.getElementById('userNameInput').value = user.name || 'Без имени';
                
                // Устанавливаем роль
                const userRoleSelect = document.getElementById('userRoleSelect');
                const adminUsers = await ServerAPI.getAdmins();
                const userRole = adminUsers[userId]?.role || 'user';
                userRoleSelect.value = userRole;
                
                // Настраиваем кнопки блокировки
                const blockUserBtn = document.getElementById('blockUserBtn');
                const unblockUserBtn = document.getElementById('unblockUserBtn');
                
                if (user.isBlocked) {
                    blockUserBtn.style.display = 'none';
                    unblockUserBtn.style.display = 'inline-block';
                } else {
                    blockUserBtn.style.display = 'inline-block';
                    unblockUserBtn.style.display = 'none';
                }
                
                // Показываем модальное окно
                document.getElementById('userModal').classList.add('active');
            } catch (error) {
                console.error('Ошибка открытия модального окна:', error);
                alert('Ошибка при загрузке данных пользователя');
            }
        }
        
        // Обработка формы пользователя
        async function handleUserFormSubmit(e) {
            e.preventDefault();
            
            try {
                const userId = document.getElementById('userId').value;
                const newRole = document.getElementById('userRoleSelect').value;
                const userRole = localStorage.getItem('user_role');
                
                // Только владелец может назначать роли
                if (userRole !== 'owner') {
                    alert('Только владелец может назначать роли');
                    return;
                }
                
                if (newRole === 'owner') {
                    alert('Нельзя назначать роль владельца');
                    return;
                }
                
                if (newRole !== 'user') {
                    await ServerAPI.setAdmin(userId, newRole);
                    alert('Роль пользователя обновлена');
                } else {
                    await ServerAPI.removeAdmin(userId);
                    alert('Права админа удалены');
                }
                
                closeAllModals();
            } catch (error) {
                console.error('Ошибка обновления пользователя:', error);
                alert('Ошибка при обновлении данных пользователя');
            }
        }
        
        // Блокировка пользователя
        async function blockUser(userId, isBlocked) {
            try {
                const success = await ServerAPI.toggleUserBlock(userId, isBlocked);
                
                if (success) {
                    alert(`Пользователь ${isBlocked ? 'заблокирован' : 'разблокирован'}`);
                    closeAllModals();
                    location.reload(); // Перезагружаем страницу
                } else {
                    alert('Ошибка при блокировке пользователя');
                }
            } catch (error) {
                console.error('Ошибка блокировки пользователя:', error);
                alert('Ошибка при блокировке пользователя');
            }
        }
        
        // Добавление администратора
        function addAdmin() {
            const userId = prompt('Введите ID пользователя для назначения администратором:');
            
            if (!userId) return;
            
            const role = prompt('Выберите уровень доступа (admin1, admin2):');
            
            if (role && (role === 'admin1' || role === 'admin2')) {
                ServerAPI.setAdmin(userId, role).then(() => {
                    alert('Администратор добавлен');
                    location.reload();
                }).catch(error => {
                    console.error('Ошибка добавления админа:', error);
                    alert('Ошибка при добавлении администратора');
                });
            } else {
                alert('Некорректный уровень доступа');
            }
        }
        
        // Закрытие всех модальных окон
        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('active');
            });
        }
    </script>
</body>
</html>
